name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted runner already contains Android SDK.
      # Add SDK tools explicitly to PATH.
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/*/bin/sdkmanager"
          fi

          echo "SDK Manager:"
          ls -la "$ANDROID_HOME/cmdline-tools/" || true

          SDKMANAGER_PATH=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Found sdkmanager at: $SDKMANAGER_PATH"

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER_PATH")

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "SDKMANAGER_PATH=$SDKMANAGER_PATH" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          sdkmanager --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Project does not contain gradlew.
      # Install Gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Build Debug APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-gallery-debug.apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run Unit Tests
        run: |
          gradle --no-daemon testDebugUnitTest

      - name: Run Lint
        if: always()
        run: |
          gradle --no-daemon lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # ---------------------------------------------------------
      # SIGNED RELEASE
      # ---------------------------------------------------------

      - name: Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret found."
            echo "Skipping signed release build."
          fi

      - name: Build Signed Release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload Release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vault-gallery-release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # GITHUB RELEASE
      # ---------------------------------------------------------

      - name: Create GitHub Release
        if: steps.keystore.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vault Gallery v${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      - name: Remove Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
